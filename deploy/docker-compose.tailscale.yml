name: pancakeslicer-tailscale

x-hardening: &hardening
  restart: unless-stopped
  read_only: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  sysctls:
    net.ipv4.ip_forward: "0"
    net.ipv6.conf.all.forwarding: "0"
  ulimits:
    core: 0
    nofile:
      soft: 4096
      hard: 4096
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "3"

services:
  pancakeslicer:
    <<: *hardening
    image: zimengxiong/pancakeslicer:latest@sha256:b78850886013b9b851bad364e3fafa94669bb0a186ba579b9b45645210779b50
    user: "65532:65532"
    init: true
    environment:
      ORCA_WEB_LISTEN: 0.0.0.0:6868
      ORCA_WEB_MAX_JOBS: "2"
      ORCA_WEB_MAX_QUEUE: "8"
      ORCA_WEB_MAX_UPLOAD_MB: "512"
      ORCA_WEB_JOB_TIMEOUT: 15m
      ORCA_WEB_JOB_TTL: 2h
      ORCA_WEB_DISK_QUOTA: "10737418240"
      ORCA_WEB_PRINTER_NETWORK: "off"
      ORCA_WEB_RELEASE_FEED: ""
      PANCAKE_STAGE_CACHE_MAX_MB: "1024"
    volumes:
      - pancakeslicer-data:/data
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=512m,mode=1777
    networks:
      - backend
    cpus: 4
    mem_limit: 8g
    memswap_limit: 8g
    pids_limit: 256
    stop_grace_period: 30s

  gateway:
    <<: *hardening
    image: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0
    user: "65532:65532"
    environment:
      PANCAKE_USERNAME: ${PANCAKE_USERNAME:-pancake}
      PANCAKE_PASSWORD_HASH: ${PANCAKE_PASSWORD_HASH:?set PANCAKE_PASSWORD_HASH to a bcrypt hash generated by caddy hash-password}
    configs:
      - source: gateway-config
        target: /etc/caddy/Caddyfile
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=1777
      - /config:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
      - /data:rw,noexec,nosuid,nodev,size=8m,uid=65532,gid=65532,mode=0700
    networks:
      - ingress
      - backend
    depends_on:
      pancakeslicer:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8081/api/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 64

  tailscale:
    <<: *hardening
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:?set TS_AUTHKEY to a Tailscale auth key permitted to use Funnel}
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-pancakeslicer}
      TS_STATE_DIR: /var/lib/tailscale
      TS_SOCKET: /var/run/tailscale/tailscaled.sock
      TS_USERSPACE: "true"
      TS_ACCEPT_DNS: "false"
      TS_EXTRA_ARGS: --accept-routes=false --ssh=false
      TS_SERVE_CONFIG: /etc/tailscale/serve.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    configs:
      - source: tailscale-serve
        target: /etc/tailscale/serve.json
    volumes:
      - tailscale-state:/var/lib/tailscale
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=32m,mode=1777
      - /var/run/tailscale:rw,noexec,nosuid,nodev,size=16m,mode=0700
    networks:
      - ingress
      - egress
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9002/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    cpus: 1
    mem_limit: 256m
    memswap_limit: 256m
    pids_limit: 128

networks:
  backend:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  ingress:
    driver: bridge
    internal: true
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  egress:
    driver: bridge
    enable_ipv6: false
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.host_binding_ipv4: 127.0.0.1

volumes:
  pancakeslicer-data:
  tailscale-state:

configs:
  tailscale-serve:
    content: |
      {
        "TCP": {
          "443": { "HTTPS": true }
        },
        "Web": {
          "$${TS_CERT_DOMAIN}:443": {
            "Handlers": {
              "/": { "Proxy": "http://gateway:8080" }
            }
          }
        },
        "AllowFunnel": {
          "$${TS_CERT_DOMAIN}:443": true
        }
      }
  gateway-config:
    content: |
      {
        admin off
        auto_https off
        persist_config off
      }
      :8080 {
        basic_auth {
          {env.PANCAKE_USERNAME} {env.PANCAKE_PASSWORD_HASH}
        }
        @cross_site {
          method POST PUT PATCH DELETE
          header Sec-Fetch-Site cross-site
        }
        respond @cross_site 403
        request_body {
          max_size 512MiB
        }
        header {
          -Server
          X-Content-Type-Options nosniff
          X-Frame-Options DENY
          Referrer-Policy no-referrer
          Strict-Transport-Security "max-age=31536000"
        }
        reverse_proxy pancakeslicer:6868 {
          header_up -Authorization
          header_up X-Forwarded-Proto https
          flush_interval -1
          transport http {
            response_header_timeout 40m
          }
        }
      }
      http://127.0.0.1:8081 {
        bind 127.0.0.1
        reverse_proxy /api/healthz pancakeslicer:6868
      }
